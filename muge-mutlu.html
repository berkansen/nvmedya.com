<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Müge Karagöz Mutlu - Nisan Vitrini Media</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            text-align: center;
        }

        .media-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .profile-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .profile-bio {
            color: var(--text-main);
            font-size: 0.95rem;
            margin-top: -0.5rem;
            line-height: 1.6;
        }

        .links-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 1.1rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .link-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
            filter: brightness(1.1);
        }

        .link-btn i {
            font-size: 1.5rem;
            position: absolute;
            left: 1.5rem;
        }

        /* Specific Colors */
        .btn-instagram {
            background: linear-gradient(45deg, #405de6, #5851db, #833ab4, #c13584, #e1306c, #fd1d1d);
        }
        
        .btn-vizon {
            background-color: #B5A18F; /* Vizon Rengi */
        }

        .btn-darkslate {
            background-color: #2c3e50; /* Sen kimim uyumlu modern renk */
        }

        .btn-youtube {
            background-color: #FF0000;
        }

        .btn-tiktok {
            background-color: #ffffff;
            color: #000000 !important;
            border: 1px solid #000000;
        }

        .btn-calendar {
            background-color: #4285F4;
        }

        .footer-minimal {
            margin-top: 3rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            opacity: 0.7;
        }

        .qr-section {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #fff;
            border-radius: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            width: fit-content;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .qr-code {
            width: 120px;
            height: 120px;
            display: block;
        }
    </style>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/favicon.png">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JD1C5PBEKD"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-JD1C5PBEKD');
    </script>

</head>

<body>

    <div class="media-container">
        <!-- Profile Section -->
        <div class="profile-section">
            <img src="assets/muge-mutlu.jpg" alt="Müge Karagöz Mutlu" class="profile-img">
            <h1 class="profile-name">Müge Karagöz Mutlu</h1>
            <p style="font-weight: 500; color: #555; margin-bottom: 5px;">Zenginlik & Yaşam Koçu</p>
            <div class="profile-bio" style="text-align: center; padding: 0 10px; font-weight: 300;">
                <p>Marisa Peer yöntemi ile zenginliğine ve yaşam amacına kavuşan binlerce kişiden biri ol.</p>
            </div>
        </div>

        <!-- Links Section -->
        <div class="links-section">
            <!-- Instagram -->
            <a href="https://www.instagram.com/mugemutlu.official" target="_blank" class="link-btn btn-instagram" rel="noopener noreferrer">
                <i class='bx bxl-instagram'></i>
                Instagram
            </a>

            <!-- Zihnini Zenginliğe Programla -->
            <a href="https://www.shopier.com/mugekaragozmutlu/47898347" target="_blank" class="link-btn btn-vizon" rel="noopener noreferrer">
                <i class='bx bx-brain'></i>
                <span>Zihnini Zenginliğe<br>Programla</span>
            </a>

            <!-- Randevu Takvimi -->
            <a href="https://calendar.app.google/v3MsZZYBxHggyNzw8" target="_blank" class="link-btn btn-calendar" rel="noopener noreferrer">
                <i class='bx bx-calendar'></i>
                Randevu Takvimi
            </a>

            <!-- TikTok -->
            <a href="https://www.tiktok.com/@mugemutluofficial" target="_blank" class="link-btn btn-tiktok" rel="noopener noreferrer">
                <i class='bx bxl-tiktok'></i>
                TikTok
            </a>

            <!-- YouTube -->
            <a href="https://www.youtube.com/@Muge-Mutlu" target="_blank" class="link-btn btn-youtube" rel="noopener noreferrer">
                <i class='bx bxl-youtube'></i>
                YouTube
            </a>

            <!-- Ben Kimim -->
            <a href="https://www.nvmedya.com/muge-mutlu-bio" target="_blank" class="link-btn btn-darkslate" rel="noopener noreferrer">
                <i class='bx bx-user'></i>
                Ben Kimim
            </a>
        </div>

        <!-- Section QR Code -->
        <div class="qr-section">
            <img src="assets/qr-muge-mutlu.png" alt="QR Code" class="qr-code">
        </div>

        <!-- Footer -->
        <footer class="footer-minimal">
            &copy; 2026 Nisan Vitrini Media
        </footer>
    </div>

    <script src="js/cookie-consent.js"></script>
</body>

</html>
