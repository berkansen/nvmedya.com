<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seminer Hediyeleri - Nisan Vitrini Media</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            text-align: center;
        }

        .media-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
        }

        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .profile-img {
            width: 180px;
            height: auto;
            max-height: 120px;
            object-fit: contain;
            margin-bottom: 0.5rem;
        }

        .profile-name {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
        }

        .profile-bio {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-top: 0;
            line-height: 1.5;
            padding: 0 1rem;
        }

        .links-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 1.2rem 3.8rem;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1.1rem;
            text-align: center;
            line-height: 1.3;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .link-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.15);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }

        .link-btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .link-btn:hover::before {
            opacity: 1;
        }

        .link-btn i {
            font-size: 1.8rem;
            position: absolute;
            left: 1.5rem;
        }

        /* AI Button Specific Styles */
        .btn-ai {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-prompt {
            background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
        }

        .btn-drive {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .btn-whatsapp-community {
            background: linear-gradient(135deg, #075E54 0%, #25D366 100%);
        }
        
        .btn-ai i, .btn-prompt i, .btn-drive i, .btn-whatsapp-community i {
            animation: pulse-icon 2s infinite ease-in-out;
        }

        @keyframes pulse-icon {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
            100% { transform: scale(1); opacity: 0.9; }
        }

        .footer-minimal {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            opacity: 0.7;
        }
    </style>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/favicon.png">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JD1C5PBEKD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-JD1C5PBEKD');
    </script>

</head>

<body>

    <div class="media-container">
        <!-- Profile Section -->
        <div class="profile-section">
            <a href="index.html">
                <img src="assets/nisanvitrini-logo.png" alt="Nisan Vitrini Media" class="profile-img">
            </a>
            <h1 class="profile-name">Seminer Hediyeleri</h1>
            <p class="profile-bio">Eğitim seminerimize katılımınız için teşekkür ederiz. Özel hazırladığımız dijital araçlara aşağıdan ulaşabilirsiniz.</p>
        </div>

        <!-- Links Section -->
        <div class="links-section">
            <!-- 1. AI Assistant -->
            <a href="https://gemini.google.com/gem/1kduxx0FqdSuWjPfXoQp66thQngnEgLMe?usp=sharing" target="_blank" class="link-btn btn-ai">
                <i class='bx bx-bot'></i>
                Yapay Zeka Sosyal Medya Asistanı
            </a>

            <!-- 2. Cover Image Prompt -->
            <a href="https://gemini.google.com/gem/1mRiLXfdAj1qm6rb8jb-NPgp4iuUNYp3B?usp=sharing" target="_blank" class="link-btn btn-prompt">
                <i class='bx bx-image-alt'></i>
                Kapak Görseli Prompt Üretme
            </a>

            <!-- 3. Drive Folder/Spreadsheet -->
            <a href="https://docs.google.com/spreadsheets/d/1W9B1RCvSb8qWuLzfPdMfIAtKa0AMXV6M5zmOTrSXzXo/edit?usp=sharing" target="_blank" class="link-btn btn-drive">
                <i class='bx bx-folder'></i>
                Eğitim Drive Dosyamız
            </a>

            <!-- 4. WhatsApp Community -->
            <a href="https://chat.whatsapp.com/CON9L3fyXwVGHiGBHxFWuf" target="_blank" class="link-btn btn-whatsapp-community">
                <i class='bx bxl-whatsapp'></i>
                WhatsApp Topluluğumuz
            </a>
            
            <!-- New buttons will be added here -->
        </div>

        <!-- Footer -->
        <footer class="footer-minimal">
            &copy; 2026 Nisan Vitrini Media
        </footer>
    </div>

</body>

</html>
