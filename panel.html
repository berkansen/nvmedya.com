<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - Nisan Vitrini Media</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/favicon.png">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JD1C5PBEKD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-JD1C5PBEKD');
    </script>

</head>

<body>
    <div class="panel-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="assets/nisan-vitrini-logo-dark.png" alt="Logo">
                <span>Panel</span>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active"><i class='bx bx-id-card'></i> Bio Link Düzenle</a>
                <a href="#" class="nav-item"><i class='bx bx-cog'></i> Ayarlar</a>
                <a href="/" class="nav-item logout"><i class='bx bx-log-out'></i> Çıkış</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="panel-content">
            <header class="panel-header">
                <h1>Profil Düzenle</h1>
                <div class="user-info">
                    <span>Admin</span>
                    <img src="assets/nisanvitrini-logo.png" alt="Admin" class="avatar-sm">
                </div>
            </header>

            <div class="panel-card">
                <form class="panel-form">
                    <!-- Profile Photo Section -->
                    <div class="form-section center">
                        <div class="photo-upload-wrapper">
                            <img src="assets/nisanvitrini-logo.png" class="preview-img" id="previewImg">
                            <label for="profileUpload" class="upload-btn">
                                <i class='bx bx-camera'></i>
                            </label>
                            <input type="file" id="profileUpload" hidden accept="image/*">
                        </div>
                        <p class="helper-text">Profil fotoğrafını değiştirmek için ikona tıkla</p>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Ad Soyad / Marka Adı</label>
                            <input type="text" class="input-light" value="Nisan Vitrini Media" placeholder="Ad Soyad">
                        </div>

                        <div class="form-group">
                            <label>Ünvan / Alt Başlık</label>
                            <input type="text" class="input-light" value="Yeni nesil medya çözümleri."
                                placeholder="Ünvan">
                        </div>
                    </div>

                    <hr class="divider">

                    <h3>Sosyal Medya Linkleri</h3>

                    <div class="link-item">
                        <div class="link-icon instagram"><i class='bx bxl-instagram'></i></div>
                        <input type="text" class="input-light" value="https://www.instagram.com/nisanvitrinimedia"
                            placeholder="Instagram URL">
                    </div>

                    <div class="link-item">
                        <div class="link-icon youtube"><i class='bx bxl-youtube'></i></div>
                        <input type="text" class="input-light" value="https://www.youtube.com/@nisanvitrinimedia"
                            placeholder="YouTube URL">
                    </div>

                    <div class="link-item">
                        <div class="link-icon threads">
                            <svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width: 1.2rem; height: 1.2rem; fill: currentColor;"><path d="M12.186 24h-.007c-3.581-.024-6.334-1.205-8.184-3.509C2.35 18.44 1.5 15.586 1.472 12.01v-.017c.03-3.579.879-6.43 2.525-8.482C5.845 1.205 8.6.024 12.18 0h.014c2.746.02 5.043.725 6.826 2.098 1.677 1.29 2.858 3.13 3.509 5.467l-2.04.569c-1.104-3.96-3.898-5.984-8.304-6.015-2.91.022-5.11.936-6.54 2.717C4.307 6.504 3.616 8.914 3.589 12c.027 3.086.718 5.496 2.057 7.164 1.43 1.783 3.631 2.698 6.54 2.717 2.623-.02 4.358-.631 5.8-2.045 1.647-1.613 1.618-3.593 1.09-4.798-.31-.71-.873-1.3-1.634-1.75-.192 1.352-.622 2.446-1.284 3.272-.886 1.102-2.14 1.704-3.73 1.79-1.202.065-2.361-.218-3.259-.801-1.063-.689-1.685-1.74-1.752-2.964-.065-1.19.408-2.285 1.33-3.082.88-.76 2.119-1.207 3.583-1.291a13.853 13.853 0 0 1 3.02.142c-.126-.742-.375-1.332-.75-1.757-.513-.586-1.308-.883-2.359-.89h-.029c-.844 0-1.992.232-2.721 1.32L7.734 7.847c.98-1.454 2.568-2.256 4.478-2.256h.044c3.194.02 5.097 1.975 5.287 5.388.108.046.216.094.321.142 1.49.7 2.58 1.761 3.154 3.07.797 1.82.871 4.79-1.548 7.158-1.85 1.81-4.094 2.628-7.277 2.65Zm1.003-11.69c-.242 0-.487.007-.739.021-1.836.103-2.98.946-2.916 2.143.067 1.256 1.452 1.839 2.784 1.767 1.224-.065 2.818-.543 3.086-3.71a10.5 10.5 0 0 0-2.215-.221z"/></svg>
                        </div>
                        <input type="text" class="input-light" value="https://www.threads.net/@nisanvitrinimedia"
                            placeholder="Threads URL">
                    </div>

                    <div class="link-item">
                        <div class="link-icon whatsapp"><i class='bx bxl-whatsapp'></i></div>
                        <input type="text" class="input-light" value="https://wa.me/905526288131"
                            placeholder="WhatsApp URL">
                    </div>

                    <div class="link-item">
                        <div class="link-icon location"><i class='bx bx-map'></i></div>
                        <input type="text" class="input-light" value="https://maps.google.com/..."
                            placeholder="Konum URL">
                    </div>

                    <div class="action-buttons">
                        <button type="button" class="btn btn-outline">İptal</button>
                        <button type="button" class="btn btn-primary">Kaydet ve Yayınla</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        // Simple Preview Logic for Image
        document.getElementById('profileUpload').addEventListener('change', function (e) {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    document.getElementById('previewImg').src = e.target.result;
                }
                reader.readAsDataURL(e.target.files[0]);
            }
        });
    </script>
</body>

</html>
