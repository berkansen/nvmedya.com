    <style>
        /* ─── Bio page base ─────────────────────────────── */
        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem 1rem 2rem;
            text-align: center;
        }

        .media-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        /* ─── Profile section ───────────────────────────── */
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            padding-bottom: 1.25rem;
        }

        .profile-img {
            width: 130px;
            height: 130px;
            object-fit: contain;
            border-radius: 50%;
            margin-bottom: 0.25rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background-color: #fff;
        }

        .profile-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
        }

        .profile-bio {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin: 0;
        }

        /* ─── Links section ─────────────────────────────── */
        .links-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        /* ─── Main action button ────────────────────────── */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.875rem 1rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            min-height: 52px;
            box-sizing: border-box;
        }

        .link-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
            filter: brightness(1.1);
        }

        .link-btn:focus-visible {
            outline: 3px solid var(--primary-color);
            outline-offset: 3px;
        }

        .link-btn i {
            font-size: 1.4rem;
            position: absolute;
            left: 1.25rem;
        }

        /* ─── Button colours (unchanged) ───────────────── */
        .btn-instagram {
            background: linear-gradient(45deg, #405de6, #5851db, #833ab4, #c13584, #e1306c, #fd1d1d);
        }

        .btn-whatsapp  { background-color: #25D366; }
        .btn-phone     { background-color: #34b7f1; }
        .btn-website   { background-color: var(--primary-color); }
        .btn-calendar  { background-color: #4285F4; }
        .btn-location  { background-color: #EA4335; }
        .btn-iklim     { background-color: #E2A0B1; }
        .btn-aras      { background-color: #0047AB; }

        /* ─── Accordion Group & Items ────────────────────── */
        .accordion-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .accordion-item {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }

        /* Accordion Triggers - Renkli & İkonlu */
        .accordion-trigger {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            padding: 0.875rem 1.25rem;
            border: none;
            cursor: pointer;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            min-height: 52px;
            box-sizing: border-box;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .accordion-trigger:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .accordion-trigger:focus-visible {
            outline: 3px solid var(--primary-color);
            outline-offset: 3px;
        }

        /* Specific Accordion Trigger Backgrounds */
        .acc-trigger-davetiyeler {
            background-color: #E2A0B1; /* Davetiye pudra pembe */
        }

        .acc-trigger-instagram {
            background: linear-gradient(45deg, #405de6, #5851db, #833ab4, #c13584, #e1306c, #fd1d1d);
        }

        .acc-trigger-daha-fazlasi {
            background-color: var(--primary-color); /* NVM Ana Kırmızı/Mor accent */
        }

        .accordion-title-icon {
            font-size: 1.4rem;
            margin-right: 0.75rem;
            flex-shrink: 0;
            color: #ffffff;
        }

        .accordion-title-text {
            flex-grow: 1;
            text-align: left;
        }

        .accordion-icon {
            font-size: 1.4rem;
            color: #ffffff;
            transition: transform 0.3s ease;
            flex-shrink: 0;
            margin-left: 0.5rem;
            opacity: 0.9;
        }

        .accordion-trigger[aria-expanded="true"] .accordion-icon {
            transform: rotate(180deg);
        }

        /* Accordion Panels & Child Links */
        .accordion-panel {
            display: none;
            flex-direction: column;
            padding: 0.5rem;
            gap: 0.375rem;
            background: rgba(10, 10, 10, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .accordion-panel.is-open {
            display: flex;
        }

        /* Compact link row with tint & icon */
        .compact-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.925rem;
            font-weight: 500;
            border-radius: 12px;
            min-height: 48px;
            box-sizing: border-box;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        .compact-link:hover {
            filter: brightness(1.25);
            transform: translateX(3px);
        }

        .compact-link:focus-visible {
            outline: 2px solid var(--primary-color);
            outline-offset: -2px;
        }

        .compact-link-content {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .compact-icon {
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .compact-link-arrow {
            color: var(--text-muted);
            font-size: 1.1rem;
            flex-shrink: 0;
            opacity: 0.7;
            transition: transform 0.2s ease;
        }

        .compact-link:hover .compact-link-arrow {
            transform: translateX(2px);
            opacity: 1;
        }

        /* Child Link Specific Tinted Styles */
        .link-iklim {
            background: rgba(226, 160, 177, 0.12);
            border-left-color: #E2A0B1;
        }

        .link-fenomen {
            background: rgba(225, 29, 72, 0.12);
            border-left-color: var(--primary-color);
        }

        .link-aras {
            background: rgba(0, 71, 171, 0.12);
            border-left-color: #0047AB;
        }

        .link-ig-main {
            background: rgba(225, 48, 108, 0.12);
            border-left-color: #E1306C;
        }

        .link-ig-davetiye {
            background: rgba(226, 160, 177, 0.12);
            border-left-color: #E2A0B1;
        }

        .link-ig-nvm {
            background: rgba(131, 58, 180, 0.12);
            border-left-color: #833ab4;
        }

        .link-blog {
            background: rgba(225, 29, 72, 0.12);
            border-left-color: var(--primary-color);
        }

        .link-phone-sub {
            background: rgba(52, 183, 241, 0.12);
            border-left-color: #34b7f1;
        }

        .link-map-sub {
            background: rgba(234, 67, 53, 0.12);
            border-left-color: #EA4335;
        }

        /* ─── Social Icons Row (Renkli Brand Platformları) ─── */
        .social-icons-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.625rem;
            width: 100%;
            margin-top: 0.25rem;
        }

        .social-icon-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            text-decoration: none;
            font-size: 1.35rem;
            transition: all 0.25s ease;
            flex-shrink: 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.25);
        }

        .social-icon-link:hover {
            transform: translateY(-3px) scale(1.05);
            filter: brightness(1.15);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
        }

        .social-icon-link:focus-visible {
            outline: 3px solid var(--primary-color);
            outline-offset: 3px;
        }

        /* Platform Brand Colors */
        .social-ig {
            background: linear-gradient(45deg, #405de6, #5851db, #833ab4, #c13584, #e1306c, #fd1d1d);
            color: #ffffff;
        }

        .social-tiktok {
            background: #010101;
            color: #ffffff;
            border: 1px solid rgba(37, 244, 238, 0.6);
            box-shadow: -2px 0 8px rgba(37, 244, 238, 0.3), 2px 0 8px rgba(254, 9, 121, 0.3);
        }

        .social-yt {
            background: #FF0000;
            color: #ffffff;
        }

        .social-linkedin {
            background: #0A66C2;
            color: #ffffff;
        }

        .social-wa {
            background: #25D366;
            color: #ffffff;
        }

        /* ─── QR Section (Unchanged) ────────────────────── */
        .qr-section {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #fff;
            border-radius: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            width: fit-content;
        }

        .qr-code {
            width: 120px;
            height: 120px;
            display: block;
        }

        /* ─── Footer ────────────────────────────────────── */
        .footer-minimal {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            opacity: 0.7;
        }

        /* ─── Spacing Helpers ───────────────────────────── */
        .section-gap {
            margin-top: 0.75rem;
        }

        /* ─── Reduced Motion ────────────────────────────── */
        @media (prefers-reduced-motion: reduce) {
            .accordion-icon { transition: none; }
            .link-btn, .accordion-trigger, .compact-link, .social-icon-link {
                transition: none;
            }
        }

        /* ─── Desktop: keep compact character ───────────── */
        @media (min-width: 600px) {
            body { padding: 2.5rem 1.5rem 3rem; }
        }
    </style>

    <!-- Accordion JS — bağımsız, QR veya cookie JS ile çakışmaz -->
    <script>
        (function () {
            'use strict';

            var triggers = document.querySelectorAll('.accordion-trigger');

            function openPanel(trigger, panel) {
                trigger.setAttribute('aria-expanded', 'true');
                panel.classList.add('is-open');
            }

            function closePanel(trigger, panel) {
                trigger.setAttribute('aria-expanded', 'false');
                panel.classList.remove('is-open');
            }

            triggers.forEach(function (trigger) {
                trigger.addEventListener('click', function () {
                    var panelId = trigger.getAttribute('aria-controls');
                    var panel   = document.getElementById(panelId);
                    var isOpen  = trigger.getAttribute('aria-expanded') === 'true';

                    // Tüm accordion'ları kapat (max 1 açık)
                    triggers.forEach(function (t) {
                        var p = document.getElementById(t.getAttribute('aria-controls'));
                        if (t !== trigger) { closePanel(t, p); }
                    });

                    // Tıklananı toggle et
                    if (isOpen) {
                        closePanel(trigger, panel);
                    } else {
                        openPanel(trigger, panel);
                    }
                });
            });
        })();
    </script>

    <script src="js/cookie-consent.js"></script>

</body>
