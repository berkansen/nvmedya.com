        /* ─── Bio page base ─────────────────────────────── */
        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem 1rem 2rem;
            text-align: center;
        }

        .media-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        /* ─── Profile section ───────────────────────────── */
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            padding-bottom: 1.25rem;
        }

        .profile-img {
            width: 130px;
            height: 130px;
            object-fit: contain;
            border-radius: 50%;
            margin-bottom: 0.25rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background-color: #fff;
        }

        .profile-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
        }

        .profile-bio {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin: 0;
        }

        /* ─── Links section ─────────────────────────────── */
        .links-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        /* ─── Main action button ────────────────────────── */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.875rem 1rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            min-height: 52px;
            box-sizing: border-box;
        }

        .link-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
            filter: brightness(1.1);
        }

        .link-btn:focus-visible {
            outline: 3px solid var(--primary-color);
            outline-offset: 3px;
        }

        .link-btn i {
            font-size: 1.4rem;
            position: absolute;
            left: 1.25rem;
        }

        /* ─── Button colours (unchanged) ───────────────── */
        .btn-instagram {
            background: linear-gradient(45deg, #405de6, #5851db, #833ab4, #c13584, #e1306c, #fd1d1d);
        }

        .btn-whatsapp  { background-color: #25D366; }
        .btn-phone     { background-color: #34b7f1; }
        .btn-website   { background-color: var(--primary-color); }
        .btn-calendar  { background-color: #4285F4; }
        .btn-location  { background-color: #EA4335; }
        .btn-iklim     { background-color: #E2A0B1; }
        .btn-aras      { background-color: #0047AB; }

        /* ─── Accordion ─────────────────────────────────── */
        .accordion-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .accordion-item {
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            overflow: hidden;
            background: rgba(255,255,255,0.04);
        }

        .accordion-trigger {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0.875rem 1.25rem;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            min-height: 52px;
            box-sizing: border-box;
            transition: background 0.2s ease;
        }

        .accordion-trigger:hover {
            background: rgba(255,255,255,0.05);
        }

        .accordion-trigger:focus-visible {
            outline: 3px solid var(--primary-color);
            outline-offset: -3px;
        }

        .accordion-icon {
            font-size: 1.2rem;
            color: var(--text-muted);
            transition: transform 0.25s ease;
            flex-shrink: 0;
            line-height: 1;
        }

        .accordion-trigger[aria-expanded="true"] .accordion-icon {
            transform: rotate(180deg);
        }

        .accordion-panel {
            display: none;
            flex-direction: column;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .accordion-panel.is-open {
            display: flex;
        }

        /* ─── Compact link row ──────────────────────────── */
        .compact-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.25rem;
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 500;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            min-height: 48px;
            box-sizing: border-box;
            transition: background 0.2s ease;
        }

        .compact-link:last-child {
            border-bottom: none;
        }

        .compact-link:hover {
            background: rgba(255,255,255,0.05);
        }

        .compact-link:focus-visible {
            outline: 3px solid var(--primary-color);
            outline-offset: -3px;
        }

        .compact-link-arrow {
            color: var(--text-muted);
            font-size: 1rem;
            flex-shrink: 0;
        }

        /* ─── Social icons row ──────────────────────────── */
        .social-icons-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            margin-top: 0.25rem;
        }

        .social-icon-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.15);
            color: var(--text-main);
            text-decoration: none;
            font-size: 1.3rem;
            transition: all 0.25s ease;
            background: rgba(255,255,255,0.05);
            flex-shrink: 0;
        }

        .social-icon-link:hover {
            background: rgba(255,255,255,0.12);
            transform: translateY(-2px);
        }

        .social-icon-link:focus-visible {
            outline: 3px solid var(--primary-color);
            outline-offset: 2px;
        }

        /* ─── QR section (unchanged) ────────────────────── */
        .qr-section {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #fff;
            border-radius: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            width: fit-content;
        }

        .qr-code {
            width: 120px;
            height: 120px;
            display: block;
        }

        /* ─── Footer ────────────────────────────────────── */
        .footer-minimal {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            opacity: 0.7;
        }

        /* ─── Spacing helpers ───────────────────────────── */
        .section-gap {
            margin-top: 0.75rem;
        }

        /* ─── Reduced motion ────────────────────────────── */
        @media (prefers-reduced-motion: reduce) {
            .accordion-icon { transition: none; }
            .link-btn, .accordion-trigger, .compact-link, .social-icon-link {
                transition: none;
            }
        }

        /* ─── Desktop: keep compact character ───────────── */
        @media (min-width: 600px) {
            body { padding: 2.5rem 1.5rem 3rem; }
        }

    <!-- Accordion JS — bağımsız, QR veya cookie JS ile çakışmaz -->
    <script>
        (function () {
            'use strict';

            var triggers = document.querySelectorAll('.accordion-trigger');

            function openPanel(trigger, panel) {
                trigger.setAttribute('aria-expanded', 'true');
                panel.classList.add('is-open');
            }

            function closePanel(trigger, panel) {
                trigger.setAttribute('aria-expanded', 'false');
                panel.classList.remove('is-open');
            }

            triggers.forEach(function (trigger) {
                trigger.addEventListener('click', function () {
                    var panelId = trigger.getAttribute('aria-controls');
                    var panel   = document.getElementById(panelId);
                    var isOpen  = trigger.getAttribute('aria-expanded') === 'true';

                    // Tüm accordion'ları kapat (max 1 açık)
                    triggers.forEach(function (t) {
                        var p = document.getElementById(t.getAttribute('aria-controls'));
                        if (t !== trigger) { closePanel(t, p); }
                    });

                    // Tıklananı toggle et
                    if (isOpen) {
                        closePanel(trigger, panel);
                    } else {
                        openPanel(trigger, panel);
                    }
                });

                // Klavye: Enter ve Space zaten button'da çalışır, ek handler gerekmez
            });
        })();
    </script>
