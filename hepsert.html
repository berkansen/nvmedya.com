<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hepsert Spor Kulübü - Nisan Vitrini Media</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            text-align: center;
        }

        .media-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            object-fit: contain;
            border-radius: 50%;
            margin-bottom: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background-color: white;
        }

        .profile-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .profile-bio {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: -0.5rem;
            min-height: 1rem;
        }

        .links-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 1rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .link-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
            filter: brightness(1.1);
        }

        .link-btn i {
            font-size: 1.5rem;
            position: absolute;
            left: 1.5rem;
        }

        /* Specific Colors */
        .btn-instagram {
            background: linear-gradient(45deg, #405de6, #5851db, #833ab4, #c13584, #e1306c, #fd1d1d);
        }

        .btn-whatsapp {
            background-color: #25D366;
        }

        .btn-phone {
            background-color: #007bff;
        }

        .btn-location {
            background-color: #EA4335;
        }

        .btn-tiktok {
            background-color: #000000;
        }

        .btn-youtube {
            background-color: #FF0000;
        }

        .footer-minimal {
            margin-top: 3rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            opacity: 0.7;
        }

        .qr-section {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #fff;
            border-radius: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            width: fit-content;
        }

        .qr-code {
            width: 120px;
            height: 120px;
            display: block;
        }
    </style>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/favicon.png">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JD1C5PBEKD"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-JD1C5PBEKD');
    </script>

</head>

<body>

    <div class="media-container">
        <!-- Profile Section -->
        <div class="profile-section">
            <img src="assets/hepsert-logo.png" alt="Hepsert Spor Kulübü Logo" class="profile-img">
            <h1 class="profile-name">Hepsert Spor Kulübü</h1>
            <p class="profile-bio"></p>
        </div>

        <!-- Links Section -->
        <div class="links-section">
            <!-- Instagram -->
            <a href="https://www.instagram.com/hepsertsporkulubu/" target="_blank" class="link-btn btn-instagram">
                <i class='bx bxl-instagram'></i>
                Instagram
            </a>

            <!-- Telefon Et -->
            <a href="tel:+905515060708" class="link-btn btn-phone">
                <i class='bx bx-phone'></i>
                Telefon Et
            </a>

            <!-- WhatsApp -->
            <a href="https://wa.me/905515060708" target="_blank" class="link-btn btn-whatsapp">
                <i class='bx bxl-whatsapp'></i>
                WhatsApp
            </a>

            <!-- Konumumuz -->
            <a href="https://www.google.com.tr/search?sca_esv=f689f82e8856ae16&authuser=0&hl=tr&gl=tr&sxsrf=ANbL-n5mceHUWbwyCKeAvKjKYUN2s9jq6w:1771877874122&kgmid=/g/11x08j4zjn&q=Hepsert+Spor+Kul%C3%BCb%C3%BC+%C4%B0zmir+Bornova&shndl=30&source=sh/x/loc/uni/m1/1&kgs=c7895651264601f0&shem=shrtn&utm_source=shrtn,sh/x/loc/uni/m1/1"
                target="_blank" class="link-btn btn-location">
                <i class='bx bx-map'></i>
                Konumumuz
            </a>

            <!-- TikTok -->
            <a href="https://www.tiktok.com/@hepsertsporkulubu" target="_blank" class="link-btn btn-tiktok">
                <i class='bx bxl-tiktok'></i>
                TikTok
            </a>

            <!-- YouTube -->
            <a href="https://www.youtube.com/@HepsertSporKulubu" target="_blank" class="link-btn btn-youtube">
                <i class='bx bxl-youtube'></i>
                YouTube
            </a>
        </div>

        <!-- Section QR Code -->
        <div class="qr-section">
            <img src="assets/qr-hepsert.png" alt="QR Code" class="qr-code">
        </div>

        <!-- Footer -->
        <footer class="footer-minimal">
            &copy; 2026 Nisan Vitrini Media
        </footer>
    </div>

</body>

</html>
